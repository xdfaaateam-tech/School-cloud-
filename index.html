<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Class Cloud</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--pri:#4f46e5;--pri2:#7c3aed;--soft:#eef2ff;--ok:#16a34a;--warn:#f59e0b;--err:#ef4444;--shadow:0 18px 45px -18px rgba(15,23,42,.28)}
body.dark{--bg:#0b1220;--card:#111c31;--text:#e2e8f0;--muted:#94a3b8;--border:#1e293b;--soft:#1e1b4b;--shadow:0 18px 45px -18px rgba(0,0,0,.7)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:.3s}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--pri);text-decoration:none}
/* login */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(135deg,#eef2ff,#f5f3ff 45%,#ecfeff);position:relative;overflow:hidden}
body.dark .login-wrap{background:linear-gradient(135deg,#0b1220,#1e1b4b 50%,#08111f)}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;pointer-events:none}
.b1{width:420px;height:420px;background:#a5b4fc;top:-140px;left:-120px}
.b2{width:400px;height:400px;background:#99f6e4;bottom:-160px;right:-100px}
.login-card{position:relative;z-index:2;width:100%;max-width:410px;background:var(--card);border:1px solid var(--border);border-radius:26px;padding:34px 30px 26px;box-shadow:var(--shadow);text-align:center}
.logo-img{width:78px;height:78px;margin:0 auto 12px;display:block;object-fit:contain;border-radius:18px}
.login-card h1{font-size:24px;letter-spacing:-.4px}
.sub{color:var(--muted);font-size:13px;margin:4px 0 22px}
.field{text-align:left;margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.iw{display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:0 12px;transition:.2s}
.iw:focus-within{border-color:var(--pri);box-shadow:0 0 0 4px rgba(99,102,241,.15)}
.iw input{flex:1;border:none;outline:none;background:transparent;color:var(--text);padding:12px 0;font-size:14.5px;font-family:inherit}
.iw .eye{font-size:15px;opacity:.7;padding:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:11px;font-size:13.5px;font-weight:600;transition:.18s;white-space:nowrap}
.btn.primary{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 10px 22px -10px rgba(79,70,229,.9)}
.btn.primary:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn.full{width:100%;padding:13px;font-size:15px}
.btn.ghost{background:var(--soft);color:var(--pri)}
.btn.line{border:1.5px solid var(--border);background:transparent;color:var(--text)}
.btn.line:hover{border-color:var(--pri);color:var(--pri)}
.btn.danger{background:var(--err);color:#fff}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.err{color:var(--err);font-size:12.5px;min-height:17px;text-align:left;margin:2px 0 10px;font-weight:500}
.qr-btn{width:100%;margin-bottom:14px;background:var(--soft);color:var(--pri);padding:11px;border-radius:11px;font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.qr-btn:hover{filter:brightness(.96)}
.foot{margin-top:20px;padding-top:16px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;font-size:12px;color:var(--muted)}
.foot a{color:var(--muted);font-weight:600}
/* app */
.app{display:flex;min-height:100vh}
.sidebar{width:260px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
.side-head{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid var(--border)}
.side-head img{width:38px;height:38px;object-fit:contain;border-radius:10px}
.side-title{font-size:14.5px;font-weight:800}
.side-role{font-size:11px;color:var(--muted);font-weight:600}
#navList{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;font-size:13.2px;font-weight:600;color:var(--muted);text-align:left;width:100%;transition:.15s}
.nav-item span{font-size:15px;width:20px;text-align:center}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:var(--soft);color:var(--pri)}
.side-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:5px}
.side-foot a{font-size:11.5px;color:var(--muted);font-weight:600}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:11px 20px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30}
.tb-title{font-size:15px;font-weight:700;flex:1}
.tb-right{display:flex;align-items:center;gap:10px}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--bg);font-size:15px;transition:.15s}
.icon-btn:hover{background:var(--soft)}
#menuBtn{display:none}
.user-chip{display:flex;align-items:center;gap:8px;padding:3px 10px 3px 3px;border-radius:99px;background:var(--bg)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.uname{font-size:12.5px;font-weight:700;line-height:1.2}
.urole{font-size:10.5px;color:var(--muted);font-weight:600}
.content{padding:20px;max-width:1150px;width:100%;margin:0 auto;flex:1}
.hero{background:linear-gradient(120deg,var(--pri),var(--pri2));color:#fff;border-radius:18px;padding:24px 26px;margin-bottom:18px;box-shadow:0 18px 38px -20px rgba(79,70,229,.9)}
.hero h2{font-size:20px;letter-spacing:-.4px;margin-bottom:5px}
.hero p{font-size:13.2px;opacity:.92;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:11px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.sv{font-size:22px;font-weight:800;letter-spacing:-.6px}
.sl{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:11px}
.fcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:left;transition:.18s;width:100%}
.fcard:hover{transform:translateY(-3px);border-color:var(--pri);box-shadow:var(--shadow)}
.fi{font-size:22px;margin-bottom:8px}
.ft{font-size:13.5px;font-weight:700;margin-bottom:2px}
.fd{font-size:11.5px;color:var(--muted);line-height:1.45}
.sec-title{font-size:13.5px;font-weight:800;margin:18px 0 11px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:16px;margin-bottom:14px}
.panel h4{font-size:13px;font-weight:800;margin-bottom:11px}
.page-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head h2{font-size:18px;letter-spacing:-.3px;margin-bottom:2px}
.page-head p{font-size:12.5px;color:var(--muted)}
.tw{overflow-x:auto;border-radius:11px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:400px}
thead th{background:var(--bg);text-align:left;padding:9px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:800;white-space:nowrap;border-bottom:1px solid var(--border)}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg)}
.bdg{display:inline-block;padding:3px 9px;border-radius:99px;font-size:10.5px;font-weight:700;white-space:nowrap}
.mini{font-size:11px;font-weight:700;padding:5px 9px;border-radius:7px;background:var(--soft);color:var(--pri)}
.mini:hover{filter:brightness(.94)}
.mini.red{background:#fee2e2;color:var(--err)}
.ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.ul li{padding:10px 13px;background:var(--bg);border-radius:10px;font-size:12.8px;border-left:3px solid var(--pri);line-height:1.5}
.ul li b{display:block;font-size:12.5px;margin-bottom:2px}
.ul li small{color:var(--muted);font-size:11.3px}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-family:inherit;font-size:13px;outline:none}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--pri)}
.form-row textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{background:var(--soft);color:var(--pri);border-radius:10px;padding:11px 14px;font-size:12.3px;line-height:1.55;font-weight:500;margin-top:10px}
.note.warn{background:#fef3c7;color:#92400e}
.note.err{background:#fee2e2;color:#991b1b}
.note.ok{background:#dcfce7;color:#166534}
.empty{text-align:center;padding:28px;color:var(--muted);font-size:13px;font-style:italic}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:100;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:18px;max-width:560px;width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:15px}
.modal-head button{font-size:16px;color:var(--muted);padding:4px 8px;border-radius:7px}
.modal-head button:hover{background:var(--bg)}
.modal-body{padding:18px 20px 24px;overflow-y:auto;font-size:13.2px;line-height:1.6}
.modal-body h4{font-size:13px;margin:14px 0 6px;color:var(--pri)}
.modal-body p{color:var(--muted);margin-bottom:8px}
.modal-body ul{margin:0 0 8px 18px;color:var(--muted)}
/* qr */
.qr-box{display:grid;place-items:center;padding:16px;background:#fff;border-radius:12px;margin:12px 0}
.qr-box canvas,.qr-box img{max-width:100%}
#reader{width:100%;border-radius:12px;overflow:hidden}
.toast{position:fixed;top:20px;right:20px;padding:12px 18px;border-radius:11px;color:#fff;font-weight:600;font-size:13px;z-index:200;box-shadow:var(--shadow);animation:slide .3s;max-width:340px}
@keyframes slide{from{transform:translateX(400px);opacity:0}to{transform:none;opacity:1}}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--err)}
.toast.info{background:var(--pri)}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  #menuBtn{display:grid}
  .content{padding:14px}
  .user-chip .urole{display:none}
  .row2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage" class="login-wrap">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="login-card">
    <img src="logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
    <h1>Class Cloud</h1>
    <p class="sub">Sistem Manajemen Kelas</p>
    <button class="qr-btn" id="qrScanBtn">📷 Scan QR (Ujian / Absensi)</button>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label>Username</label>
        <div class="iw"><span>👤</span><input id="username" type="text" placeholder="Username" required></div>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="iw"><span>🔒</span><input id="password" type="password" placeholder="Password" required>
          <button type="button" class="eye" id="togglePw">👁️</button></div>
      </div>
      <div class="err" id="loginErr"></div>
      <button class="btn primary full" type="submit" id="loginBtn">Masuk</button>
    </form>
    <div class="foot">
      <a href="#" id="linkPrivacy">Privasi & Kebijakan</a>
      <span>•</span>
      <a href="#" id="linkContact">Kontak Admin: @zyenn_faaa</a>
    </div>
  </div>
</div>

<!-- APP -->
<div id="appPage" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
      <div><div class="side-title">Class Cloud</div><div class="side-role" id="sideRole">—</div></div>
    </div>
    <nav id="navList"></nav>
    <div class="side-foot">
      <a href="#" id="linkPrivacy2">Privasi & Kebijakan</a>
      <a href="#" id="linkContact2">Kontak Admin: @zyenn_faaa</a>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn">☰</button>
      <div class="tb-title" id="pageTitle">Dashboard</div>
      <div class="tb-right">
        <button class="icon-btn" id="themeBtn">🌙</button>
        <div class="user-chip">
          <div class="avatar" id="avatar">U</div>
          <div><div class="uname" id="uName">—</div><div class="urole" id="uRole">—</div></div>
        </div>
        <button class="btn ghost" id="logoutBtn">Keluar</button>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg hidden" id="modalBg">
  <div class="modal">
    <div class="modal-head"><h3 id="modalTitle"></h3><button id="modalClose">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
/* ============ CONFIG ============ */
const DEFAULT_API = 'https://script.google.com/macros/s/AKfycbwNypd1fKclaMONch3EdtCXKDPJeQwrm29ZzN42KuDLQ9V5xMjObRpA3ExEUt52WhTj_Q/exec';
const state = {
  token: localStorage.getItem('cc_token') || '',
  user: null,
  apiUrl: localStorage.getItem('cc_api') || DEFAULT_API
};

/* ============ API ============ */
async function api(action, data = {}) {
  const payload = { action, ...data };
  if (state.token) payload.token = state.token;
  const res = await fetch(state.apiUrl, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify(payload),
    redirect: 'follow'
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'Terjadi kesalahan');
  return j.data;
}

/* ============ UI HELPERS ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

function openModal(title, html) { $('modalTitle').textContent = title; $('modalBody').innerHTML = html; $('modalBg').classList.remove('hidden'); }
function closeModal() { $('modalBg').classList.add('hidden'); }
$('modalClose').onclick = closeModal;
$('modalBg').onclick = e => { if (e.target === $('modalBg')) closeModal(); };

const badge = (t, c) => `<span class="bdg" style="background:${c}20;color:${c}">${t}</span>`;
const statsBox = items => `<div class="stats">${items.map(i => `<div class="stat"><div class="sv" style="color:${i.c||'var(--pri)'}">${i.v}</div><div class="sl">${i.l}</div></div>`).join('')}</div>`;
const tbl = (heads, rows, empty = 'Belum ada data') => rows.length ? `<div class="tw"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : `<div class="empty">${empty}</div>`;
const panel = (title, content) => `<div class="panel">${title ? `<h4>${title}</h4>` : ''}${content}</div>`;
const ul = items => items.length ? `<ul class="ul">${items.map(i=>`<li>${i}</li>`).join('')}</ul>` : `<div class="empty">Belum ada data</div>`;
const fmtDate = s => s ? new Date(s).toLocaleString('id-ID', {dateStyle:'medium', timeStyle:'short'}) : '-';

/* ============ QR ============ */
let qrScanner = null;
async function startScan(onResult) {
  const html = `<p style="margin-bottom:10px;color:var(--muted)">Arahkan kamera ke QR Code</p><div id="reader"></div>
    <button class="btn line" style="margin-top:12px;width:100%" id="stopScan">Batal</button>`;
  openModal('Scan QR', html);
  try {
    qrScanner = new Html5Qrcode('reader');
    await qrScanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      (text) => { stopScan(); closeModal(); onResult(text); },
      () => {}
    );
    $('stopScan').onclick = () => { stopScan(); closeModal(); };
  } catch (e) {
    $('modalBody').innerHTML = `<div class="note err">Kamera tidak dapat diakses: ${esc(e.message)}</div>`;
  }
}
async function stopScan() { if (qrScanner) { try { await qrScanner.stop(); qrScanner.clear(); } catch(_){} qrScanner = null; } }

function showQRContent(text, title = 'QR Code') {
  const id = 'qr_' + Date.now();
  openModal(title, `<p>Bagikan QR ini kepada siswa:</p><div class="qr-box" id="${id}"></div>
    <p style="text-align:center;font-family:monospace;font-size:12px;word-break:break-all">${esc(text)}</p>`);
  setTimeout(() => { new QRCode($(id), { text, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M }); }, 30);
}

function handleScanResult(text) {
  if (text.startsWith('CC-EXAM:')) openPublicExam(text.slice(8));
  else if (text.startsWith('CC-ABSEN:')) openPublicAttendance(text.slice(9));
  else toast('QR tidak dikenali', 'err');
}

/* ============ AUTH ============ */
async function doLogin(u, p) {
  $('loginErr').textContent = '';
  $('loginBtn').disabled = true;
  try {
    const r = await api('login', { username: u, password: p });
    state.token = r.token;
    state.user = r.user;
    localStorage.setItem('cc_token', r.token);
    enterApp();
  } catch (e) {
    $('loginErr').textContent = '❌ ' + e.message;
  } finally {
    $('loginBtn').disabled = false;
  }
}

async function restore() {
  if (!state.token) return;
  try {
    const p = await api('getProfile');
    state.user = p;
    enterApp();
  } catch (e) {
    state.token = ''; localStorage.removeItem('cc_token');
  }
}

async function logout() {
  try { await api('logout'); } catch(_){}
  state.token = ''; state.user = null;
  localStorage.removeItem('cc_token');
  $('appPage').classList.add('hidden');
  $('loginPage').classList.remove('hidden');
  $('content').innerHTML = '';
  $('navList').innerHTML = '';
}

/* ============ NAV ============ */
const NAV = {
  admin: [
    {k:'dashboard', t:'Dashboard', i:'🏠'},
    {k:'users', t:'Manajemen Pengguna', i:'👥'},
    {k:'exams', t:'Buat Ujian', i:'📝'},
    {k:'exam-results', t:'Hasil Ujian', i:'📊'},
    {k:'att-sessions', t:'Sesi Absensi QR', i:'📷'},
    {k:'att-records', t:'Rekap Absensi', i:'✅'},
    {k:'pengumuman', t:'Pengumuman', i:'📢'},
    {k:'auto-report', t:'Laporan Otomatis', i:'📈'},
    {k:'report-history', t:'Riwayat Laporan', i:'🗂️'},
    {k:'settings', t:'Pengaturan', i:'⚙️'}
  ],
  walikelas: [
    {k:'dashboard', t:'Dashboard', i:'🏠'},
    {k:'exams', t:'Buat Ujian', i:'📝'},
    {k:'exam-results', t:'Hasil Ujian', i:'📊'},
    {k:'att-sessions', t:'Sesi Absensi QR', i:'📷'},
    {k:'att-records', t:'Rekap Absensi', i:'✅'},
    {k:'pengumuman', t:'Pengumuman', i:'📢'},
    {k:'auto-report', t:'Laporan Otomatis', i:'📈'},
    {k:'report-history', t:'Riwayat Laporan', i:'🗂️'},
    {k:'jadwal', t:'Jadwal Pelajaran', i:'📅'},
    {k:'settings', t:'Pengaturan', i:'⚙️'}
  ],
  km: [
    {k:'dashboard', t:'Dashboard', i:'🏠'},

function enterApp() {

  $('sideRole').textContent = ROLE_LABEL[u.role] || u.role;

function buildNav() {
  const items = NAV[state.user.role] || NAV.km;
  $('navList').innerHTML = items.map(it => `<button class="nav-item" data-k="${it.k}"><span>${it.i}</span>${it.t}</button>`).join('');
  $('navList').onclick = e => { const b = e.target.closest('.nav-item'); if (b) openPage(b.dataset.k); };

async function openPage(key) {
  const items = NAV[state.user.role] || NAV.km;
  const item = items.find(i => i.k === key) || items[0];
  $('pageTitle').textContent = item.t;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.k === item.k));
  $('sidebar').classList.remove('open');
  $('content').innerHTML = '<div class="empty">Memuat...</div>';
  try {
    const renderer = PAGE_RENDERERS[item.k] || PAGE_RENDERERS.dashboard;
    await renderer();
  } catch (e) {
    $('content').innerHTML = `<div class="note err">Gagal memuat: ${esc(e.message)}</div>`;
  }
}

function examForm() {
  let questions = [];
  openModal('Buat Ujian', `
    <div class="form-row"><label>Judul Ujian</label><input id="exTitle" placeholder="Contoh: Ulangan Matematika Bab 4"></div>
    <div class="form-row"><label>Deskripsi (opsional)</label><input id="exDesc"></div>
    <div class="form-row"><label>Durasi (menit)</label><input id="exDur" type="number" value="30" min="1"></div>
    <div class="form-row"><label>Soal</label><div id="qList"></div>
      <button class="btn ghost" id="addQ" style="width:100%;margin-top:8px">+ Tambah Soal</button></div>
    <button class="btn primary full" id="exSave" style="margin-top:10px">Simpan Ujian</button>
  `);
  const renderQs = () => {
    $('qList').innerHTML = questions.map((q,qi)=>`
      <div class="panel" style="padding:12px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px"><b>Soal ${qi+1}</b>
          <button class="mini red" data-rq="${qi}">Hapus</button></div>
        <div class="form-row"><input placeholder="Pertanyaan" data-qt="${qi}" value="${esc(q.text||'')}"></div>
        ${(q.options||['','']).map((o,oi)=>`
          <div style="display:flex;gap:6px;margin-bottom:6px;align-items:center">
            <input type="radio" name="correct_${qi}" data-qc="${qi}" data-oi="${oi}" ${q.correctIndex===oi?'checked':''} style="width:auto">
            <input placeholder="Opsi ${oi+1}" data-qo="${qi}" data-oi="${oi}" value="${esc(o)}" style="flex:1">
            <button class="mini red" data-ro="${qi},${oi}">×</button>
          </div>`).join('')}
        <button class="mini" data-ao="${qi}">+ Opsi</button>
      </div>`).join('');
  };
  renderQs();
  $('addQ').onclick = () => { questions.push({text:'', options:['',''], correctIndex:0}); renderQs(); };
  $('qList').oninput = e => {
    if (e.target.dataset.qt !== undefined) questions[+e.target.dataset.qt].text = e.target.value;
    if (e.target.dataset.qo !== undefined) questions[+e.target.dataset.qo].options[+e.target.dataset.oi] = e.target.value;
  };
  $('qList').onclick = e => {
    if (e.target.dataset.rq !== undefined) { questions.splice(+e.target.dataset.rq,1); renderQs(); }
    if (e.target.dataset.ro) { const [q,o]=e.target.dataset.ro.split(',').map(Number); if (questions[q].options.length>2) questions[q].options.splice(o,1); renderQs(); }
    if (e.target.dataset.ao !== undefined) { questions[+e.target.dataset.ao].options.push(''); renderQs(); }
  };
  $('qList').onchange = e => { if (e.target.dataset.qc !== undefined) questions[+e.target.dataset.qc].correctIndex = +e.target.dataset.oi; };
  $('exSave').onclick = async () => {
    try {
      questions.forEach((q,i) => { q.options = q.options.filter(o=>o.trim()); if (q.correctIndex>=q.options.length) q.correctIndex=0; });
      const r = await api('createExam', {
        title: $('exTitle').value.trim(), description: $('exDesc').value.trim(),
        duration: +$('exDur').value, questions
      });
      closeModal(); toast('Ujian dibuat','ok');
      showQRContent('CC-EXAM:' + r.qrToken, 'QR Ujian: ' + r.title);
      openPage('exams');
    } catch (e) { toast(e.message,'err'); }
  };
}

  const list = await api('getJadwal');
  const rows = list.map(j => [esc(j.hari), esc(j.jam), esc(j.mapel), esc(j.guru), esc(j.ruang)]);
  $('content').innerHTML = `<div class="page-head"><div><h2>Jadwal Pelajaran</h2><p>Jadwal kelas</p></div></div>
    ${panel('Jadwal', tbl(['Hari','Jam','Mapel','Guru','Ruang'], rows))}`;
};

/* ----- AGENDA ----- */
PAGE_RENDERERS.agenda = async () => {
  const list = await api('getAgenda');
  const canCreate = ['admin','walikelas','km','wkm','sekertaris'].includes(state.user.role);
  const items = list.map(a => `<b>${esc(a.judul)}</b><small>${esc(a.tanggal)} · ${esc(a.lokasi||'-')} · oleh ${esc(a.createdByName)}</small><div>${esc(a.deskripsi||'')}</div>`);
  $('content').innerHTML = `
    <div class="page-head"><div><h2>Agenda Kelas</h2><p>Kegiatan mendatang</p></div>
      ${canCreate?'<button class="btn primary" id="agBtn">+ Tambah Agenda</button>':''}</div>
    ${panel('Agenda', ul(items))}`;
  if (canCreate) $('agBtn').onclick = () => {
    openModal('Tambah Agenda', `
      <div class="form-row"><label>Judul</label><input id="agJudul"></div>
      <div class="form-row"><label>Tanggal</label><input id="agTgl" type="date"></div>
      <div class="form-row"><label>Lokasi</label><input id="agLok"></div>
      <div class="form-row"><label>Deskripsi</label><textarea id="agDesc"></textarea></div>
      <button class="btn primary full" id="agSave">Simpan</button>
    `);
    $('agSave').onclick = async () => {
      try {
        await api('createAgenda', {judul:$('agJudul').value.trim(), tanggal:$('agTgl').value,
          lokasi:$('agLok').value.trim(), deskripsi:$('agDesc').value.trim()});
        toast('Tersimpan','ok'); closeModal(); openPage('agenda');
      } catch(e){ toast(e.message,'err'); }
    };
  };
};

    ${panel('Profil', `
      <div class="form-row"><label>Nama Lengkap</label><input id="stNama" value="${esc(p.nama)}"></div>

      <button class="btn primary" id="stSaveProfile">Simpan Profil</button>
    `)}
    ${panel('Username', `
      <div class="form-row"><label>Username Saat Ini</label><input value="${esc(p.username)}" disabled></div>
      <div class="form-row"><label>Username Baru</label><input id="stNewUser" placeholder="minimal 3 karakter"></div>
      <div class="form-row"><label>Password (verifikasi)</label><input id="stUserPw" type="password"></div>
      <button class="btn primary" id="stSaveUser">Ubah Username</button>

      <button class="btn primary" id="stSavePw">Ubah Password</button>
    `)}
    ${panel('Server / Penyimpanan', `
      <div class="form-row"><label>URL Google Apps Script</label>
        <input id="stApi" value="${esc(state.apiUrl)}"></div>
      <button class="btn primary" id="stSaveApi">Simpan URL</button>
      <button class="btn line" id="stTestApi" style="margin-left:8px">Test Koneksi</button>
      <p style="font-size:11.5px;color:var(--muted);margin-top:8px">Data tersimpan di Google Sheets + Drive pada akun pemilik Apps Script.</p>
    `)}
  `;
  $('stSaveProfile').onclick = async () => {
    try { await api('updateProfile', {nama:$('stNama').value.trim(), email:$('stEmail').value.trim()});
      state.user.nama = $('stNama').value.trim(); state.user.email = $('stEmail').value.trim();
      $('uName').textContent = state.user.nama; toast('Profil tersimpan','ok');
    } catch(e){ toast(e.message,'err'); }
  };
  $('stSaveUser').onclick = async () => {
    try { await api('changeUsername', {newUsername:$('stNewUser').value.trim(), password:$('stUserPw').value});

    } catch(e){ toast(e.message,'err'); }
  };
  $('stSavePw').onclick = async () => {
    if ($('stNewPw').value !== $('stNewPw2').value) return toast('Konfirmasi password tidak sama','err');

    } catch(e){ toast(e.message,'err'); }
  };
  $('stSaveApi').onclick = () => {
    state.apiUrl = $('stApi').value.trim();
    localStorage.setItem('cc_api', state.apiUrl);
    toast('URL server tersimpan','ok');
  };
  $('stTestApi').onclick = async () => {
    try { const r = await api('getProfile'); toast('Koneksi OK: ' + r.nama,'ok'); }
    catch(e){ toast('Gagal: ' + e.message,'err'); }
  };
};

/* ============ PUBLIC EXAM / ATTENDANCE ============ */
async function openPublicExam(token) {
  try {
    const exam = await api('getExamByToken', {qrToken: token});
    const html = `
      <div class="note">Ujian: <b>${esc(exam.title)}</b> · ${exam.questions.length} soal · ${exam.duration} menit</div>
      <div class="form-row"><label>Nama Lengkap *</label><input id="pxNama" placeholder="Sesuai absen"></div>
      <div class="row2">
        <div class="form-row"><label>Kelas *</label><input id="pxKelas" placeholder="Contoh: XI RPL 1"></div>
        <div class="form-row"><label>Absensi *</label><input id="pxAbsen" type="number" placeholder="No. absen"></div>
      </div>
      <h4 style="margin:14px 0 8px">Pertanyaan</h4>
      ${exam.questions.map((q,i)=>`
        <div class="panel" style="padding:12px;margin-bottom:8px">
          <b>${i+1}. ${esc(q.text)}</b>
          ${q.options.map((o,oi)=>`<div style="margin-top:6px">
            <label style="display:flex;gap:6px;align-items:center;font-size:12.8px;cursor:pointer">
              <input type="radio" name="ans_${i}" value="${oi}"> ${esc(o)}
            </label></div>`).join('')}
        </div>`).join('')}
      <button class="btn primary full" id="pxSubmit">Kirim Jawaban</button>
    `;
    openModal('Ikuti Ujian', html);
    $('pxSubmit').onclick = async () => {
      try {
        const nama = $('pxNama').value.trim();
        const kelas = $('pxKelas').value.trim();
        const absen = $('pxAbsen').value.trim();
        if (!nama || !kelas || !absen) return toast('Nama, kelas, absensi wajib','err');
        const answers = {};
        exam.questions.forEach((q,i) => {
          const sel = document.querySelector(`input[name="ans_${i}"]:checked`);
          if (!sel) throw new Error(`Soal ${i+1} belum dijawab`);
          answers[i] = +sel.value;
        });
        const r = await api('submitExam', {qrToken: token, namaLengkap: nama, kelas, absensi: absen, answers});
        openModal('Selesai', `<div class="note ok">Jawaban terkirim!</div>
          <p style="margin-top:10px">Nilai Anda: <b style="font-size:22px">${r.score}</b></p>
          <p>Benar: ${r.correct} / ${r.total}</p>
          <button class="btn primary full" onclick="closeModal()" style="margin-top:10px">Tutup</button>`);
      } catch(e){ toast(e.message,'err'); }
    };
  } catch(e){ toast(e.message,'err'); }
}

async function openPublicAttendance(token) {
  try {
    const s = await api('getAttByToken', {qrToken: token});
    openModal('Absensi: ' + s.title, `
      <div class="note">Tanggal: ${esc(s.date)}</div>
      <div class="form-row"><label>Nama Lengkap *</label><input id="paNama"></div>
      <div class="row2">
        <div class="form-row"><label>Kelas *</label><input id="paKelas" placeholder="XI RPL 1"></div>
        <div class="form-row"><label>Absensi *</label><input id="paAbsen" type="number"></div>
      </div>
      <div class="form-row"><label>Status</label><select id="paStatus">
        <option>Hadir</option><option>Izin</option><option>Sakit</option><option>Alpa</option>
      </select></div>
      <button class="btn primary full" id="paSubmit">Catat Kehadiran</button>
    `);
    $('paSubmit').onclick = async () => {
      try {
        const nama = $('paNama').value.trim(), kelas = $('paKelas').value.trim(), absen = $('paAbsen').value.trim();
        if (!nama || !kelas || !absen) return toast('Lengkapi data','err');
        await api('markAttendance', {qrToken:token, namaLengkap:nama, kelas, absensi:absen, status:$('paStatus').value});
        openModal('Berhasil', `<div class="note ok">Kehadiran tercatat: ${esc(nama)} (${esc(kelas)}, absen ${esc(absen)})</div>
          <button class="btn primary full" onclick="closeModal()" style="margin-top:12px">Tutup</button>`);
      } catch(e){ toast(e.message,'err'); }
    };
  } catch(e){ toast(e.message,'err'); }
}
